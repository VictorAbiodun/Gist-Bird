      <path d="M24 168 L128 96 L232 168 Z" fill="#FDE496" opacity="0.7" />
      <path d="M28 164 L106 106 M228 164 L150 106" stroke="#F0C451" stroke-width="4" stroke-linecap="round" opacity="0.65" />

      
      <path d="M26 42 L116 116 Q128 126 140 116 L230 42 Z" fill="#E6B23A" opacity="0.28" />

      
      <path d="M24 32 L117 108 Q128 117 139 108 L232 32 Z" fill="url(#envFlapGrad)" stroke="#F2C249" stroke-width="5" stroke-linejoin="round" />
    </g>

    
    <rect x="28" y="34" width="200" height="132" rx="18" ry="18" fill="none" stroke="#F2C249" stroke-width="6" />
