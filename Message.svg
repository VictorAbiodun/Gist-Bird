<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 200" width="256" height="200">
  <defs>
    
    <filter id="envGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FFD86B" flood-opacity="0.55" />
    </filter>

    
    <linearGradient id="envBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF2" />
      <stop offset="65%" stop-color="#FFF2BE" />
      <stop offset="100%" stop-color="#FCE08B" />
    </linearGradient>

    
    <linearGradient id="envFlapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF6D1" />
