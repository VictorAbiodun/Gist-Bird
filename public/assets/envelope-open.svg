  <g filter="url(#envOpenGlow)">
    
    <path d="M28 114 L117 34 Q128 24 139 34 L228 114 Z" fill="url(#envOpenFlapGrad)" stroke="#F2C249" stroke-width="6" stroke-linejoin="round" />

    
    <path d="M28 114 L228 114 L228 218 A18 18 0 0 1 210 236 L46 236 A18 18 0 0 1 28 218 Z" fill="url(#envInnerGrad)" />

    
    <g filter="url(#letterShadow)">
      <rect x="52" y="64" width="152" height="136" rx="12" ry="12" fill="#FFFFFF" stroke="#F2D27A" stroke-width="3.5" />
      
      <line x1="76" y1="92" x2="130" y2="92" stroke="#F2C249" stroke-width="6" stroke-linecap="round" />
      <line x1="76" y1="112" x2="180" y2="112" stroke="#EDE2C7" stroke-width="5" stroke-linecap="round" />
      <line x1="76" y1="128" x2="168" y2="128" stroke="#EDE2C7" stroke-width="5" stroke-linecap="round" />
      <line x1="76" y1="144" x2="152" y2="144" stroke="#EDE2C7" stroke-width="5" stroke-linecap="round" />
