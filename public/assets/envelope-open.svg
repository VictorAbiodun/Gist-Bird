      <path d="M230 114 L136 176 L230 238 Z" fill="url(#envOpenBodyGrad)" />
      
      <path d="M28 114 L118 176 M228 114 L138 176" stroke="#F0C451" stroke-width="4" stroke-linecap="round" opacity="0.75" />
      
      <path d="M26 236 L116 164 Q128 155 140 164 L230 236 Z" fill="#D9A330" opacity="0.22" />
      
      <path d="M26 240 L116 168 Q128 159 140 168 L230 240 Z" fill="url(#envBottomFoldGrad)" stroke="#F0C451" stroke-width="4.5" stroke-linejoin="round" />
