<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 260" width="256" height="260">
  <defs>
    
    <filter id="envOpenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FFD86B" flood-opacity="0.55" />
    </filter>

    
    <filter id="letterShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#C99628" flood-opacity="0.22" />
    </filter>

    
    <linearGradient id="envOpenBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF2" />
      <stop offset="65%" stop-color="#FFF2BE" />
      <stop offset="100%" stop-color="#FCE08B" />
    </linearGradient>

    
    <linearGradient id="envInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5D073" />
      <stop offset="100%" stop-color="#E3B03E" />
    </linearGradient>

    
    <linearGradient id="envOpenFlapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF3C4" />
    </linearGradient>

    
    <linearGradient id="envBottomFoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D1" />
      <stop offset="100%" stop-color="#FCE08B" />
    </linearGradient>

    
    <clipPath id="envOpenClip">
      <path d="M28 114 L228 114 L228 218 A18 18 0 0 1 210 236 L46 236 A18 18 0 0 1 28 218 Z" />
