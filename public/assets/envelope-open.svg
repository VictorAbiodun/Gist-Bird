    <path d="M28 114 L28 218 A18 18 0 0 0 46 236 L210 236 A18 18 0 0 0 228 218 L228 114" fill="none" stroke="#F2C249" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
