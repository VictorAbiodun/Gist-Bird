<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 56" width="48" height="34" role="img" aria-label="Typing">
  <style>
    .bird-type-head {
      transform-origin: 25px 40px;
      animation: birdPeck 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .bird-type-beak-lower {
      transform-origin: 39px 29px;
      animation: birdChomp 1.25s ease-in-out infinite;
    }
    .bird-type-seed-1 {
      transform-origin: 53px 44px;
      animation: seedBounce 1.25s ease-out infinite;
    }
    .bird-type-seed-2 {
      transform-origin: 62px 45px;
      animation: seedBounce 1.25s ease-out 0.14s infinite;
    }
    .bird-type-seed-3 {
      transform-origin: 70px 44px;
      animation: seedBounce 1.25s ease-out 0.28s infinite;
    }

    @keyframes birdPeck {
      0%, 100% { transform: rotate(0deg); }
      18%      { transform: rotate(28deg); }
      32%      { transform: rotate(4deg); }
      48%      { transform: rotate(28deg); }
      68%      { transform: rotate(-3deg); }
      82%      { transform: rotate(0deg); }
    }

    @keyframes birdChomp {
      0%, 10%, 100% { transform: rotate(0deg); }
      15%           { transform: rotate(16deg); }
      22%           { transform: rotate(0deg); }
      44%           { transform: rotate(16deg); }
      52%           { transform: rotate(0deg); }
    }

    @keyframes seedBounce {
      0%, 16%, 100% { transform: translateY(0); }
      24%           { transform: translateY(-3px); }
      34%           { transform: translateY(0); }
      48%           { transform: translateY(0); }
      56%           { transform: translateY(-2.5px); }
      66%           { transform: translateY(0); }
    }
  </style>

  <g stroke="#23272D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    
    <ellipse cx="44" cy="48" rx="30" ry="3.5" fill="#23272D" stroke="none" opacity="0.1" />

    
    <ellipse class="bird-type-seed-1" cx="53" cy="44" rx="4.2" ry="2.6" transform="rotate(-18 53 44)" fill="#F2B824" stroke="#8C5E1F" stroke-width="2" />
    <ellipse class="bird-type-seed-2" cx="62" cy="45" rx="4.2" ry="2.6" transform="rotate(14 62 45)" fill="#6E4A26" stroke="#3B2511" stroke-width="2" />
    <ellipse class="bird-type-seed-3" cx="70" cy="44" rx="4" ry="2.5" transform="rotate(-12 70 44)" fill="#D99B26" stroke="#8C5E1F" stroke-width="2" />

    
    <path d="M12 48 C13 40 19 37 26 37 C33 37 38 40 39 48 Z" fill="#188C4B" />
    <path d="M14 44 Q25.5 46.5 37 44" fill="none" stroke="#FFFFFF" stroke-width="2.4" />

    
    <g class="bird-type-head">
      
      <path class="bird-type-beak-lower" d="M38 27 L47 29.5 L38 32 Z" fill="#E37B1B" />
      
      <path d="M38 22.5 L50 27.5 L38 28.5 Z" fill="#FF9A33" />
      
      <circle cx="27" cy="24" r="14" fill="#92A1B3" />
      
      <path d="M17 15 A14 14 0 0 0 21 36 A13 13 0 0 1 17 15 Z" fill="#7D8C9E" stroke="none" />
      <circle cx="27" cy="24" r="14" fill="none" />
      
      <circle cx="31.5" cy="21" r="3.6" fill="#FFFFFF" stroke-width="2" />
      <circle cx="32.3" cy="21.2" r="1.9" fill="#23272D" stroke="none" />
      <circle cx="33" cy="20.4" r="0.7" fill="#FFFFFF" stroke="none" />
    </g>
  </g>
</svg>