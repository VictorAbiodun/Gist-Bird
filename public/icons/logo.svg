<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Mint-to-Sky Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6F8EE" />
      <stop offset="100%" stop-color="#C6EFE0" />
    </linearGradient>

    <!-- Subtle Drop Shadow for App Icon Depth -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1E4D3B" flood-opacity="0.16" />
    </filter>

    <!-- Beak Gradient -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9B26" />
      <stop offset="100%" stop-color="#F26E11" />
    </linearGradient>

    <!-- Head Shading -->
    <radialGradient id="headGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9FB0C4" />
      <stop offset="75%" stop-color="#8799AE" />
      <stop offset="100%" stop-color="#74869C" />
    </radialGradient>

    <!-- Hoodie Green -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#129E52" />
      <stop offset="100%" stop-color="#0B7A3E" />
    </linearGradient>

    <!-- Clip Path for Squircle App Icon -->
    <clipPath id="iconClip">
      <rect x="32" y="32" width="448" height="448" rx="108" ry="108" />
    </clipPath>
  </defs>

  <!-- App Icon Base -->
  <g filter="url(#softShadow)">
    <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad)" />
  </g>

  <!-- Clipped Mascot Emblem -->
  <g clip-path="url(#iconClip)">
    <!-- Subtle Decorative Background Ring -->
    <circle cx="256" cy="268" r="175" fill="#FFFFFF" opacity="0.45" />

    <!-- Hoodie / Shoulders -->
    <path d="M 105 495 C 110 385, 165 345, 256 345 C 347 345, 402 385, 407 495 Z" fill="url(#hoodieGrad)" />
    
    <!-- White Chest Stripe on Hoodie -->
    <path d="M 122 435 Q 256 458 390 435 L 398 468 Q 256 492 114 468 Z" fill="#FFFFFF" />

    <!-- Yellow Messenger Bag Strap -->
    <path d="M 326 355 L 182 485 L 222 485 L 352 368 Z" fill="#F6C11E" />
    <path d="M 326 355 L 182 485" stroke="#D9A30E" stroke-width="3" fill="none" />

    <!-- Hoodie Collar -->
    <path d="M 168 352 C 195 388, 317 388, 344 352 C 330 330, 182 330, 168 352 Z" fill="#096834" />

    <!-- Pigeon Head -->
    <circle cx="252" cy="242" r="114" fill="url(#headGrad)" />

    <!-- Subtle Cheek Highlight -->
    <ellipse cx="185" cy="268" rx="16" ry="10" fill="#B6C5D6" opacity="0.55" transform="rotate(-12 185 268)" />

    <!-- Cool Black Sunglasses -->
    <g transform="rotate(-7 256 225)">
      <!-- Temple Arm -->
      <path d="M 140 218 L 175 212" stroke="#181C20" stroke-width="11" stroke-linecap="round" />
      <!-- Bridge -->
      <path d="M 244 206 Q 262 202 280 206" stroke="#181C20" stroke-width="10" fill="none" />
      <!-- Top Frame Bar -->
      <path d="M 168 196 Q 262 188 354 198" stroke="#181C20" stroke-width="12" stroke-linecap="round" fill="none" />
      
      <!-- Left Lens -->
      <path d="M 172 198 L 248 198 L 242 246 C 239 262, 185 262, 179 246 Z" fill="#1C2126" />
      <!-- Right Lens -->
      <path d="M 276 198 L 350 198 L 343 246 C 338 262, 286 262, 281 246 Z" fill="#1C2126" />

      <!-- Glass Reflections -->
      <polygon points="192,204 204,204 193,250 183,248" fill="#FFFFFF" opacity="0.22" />
      <polygon points="211,204 217,204 206,251 200,251" fill="#FFFFFF" opacity="0.15" />
      <polygon points="295,204 307,204 296,250 286,248" fill="#FFFFFF" opacity="0.22" />
      <polygon points="314,204 320,204 309,251 303,251" fill="#FFFFFF" opacity="0.15" />
    </g>

    <!-- Orange Beak -->
    <path d="M 246 244 C 242 246, 244 276, 256 286 C 261 290, 267 289, 274 285 L 326 258 C 332 255, 332 249, 325 247 L 266 239 C 258 238, 250 241, 246 244 Z" fill="url(#beakGrad)" />
    <!-- Beak Top Highlight -->
    <path d="M 254 244 L 318 251 L 264 256 Z" fill="#FFB347" opacity="0.45" />

    <!-- Four-Point Sparkle -->
    <path d="M 386 126 Q 386 156 416 156 Q 386 156 386 186 Q 386 156 356 156 Q 386 156 386 126 Z" fill="#FFC82C" />
  </g>

  <!-- Crisp Inner Border Highlight -->
  <rect x="34" y="34" width="444" height="444" rx="106" ry="106" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.65" />
</svg>