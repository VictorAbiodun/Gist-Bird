# Supabase CLI config. Used for local dev (`supabase start`) and `supabase link` / `supabase db push`.
project_id = "gist-bird"

[api]
enabled = true

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed/campus.sql"]

[auth]
enabled = true
# Production URL is set in the dashboard (Auth → URL Configuration). These are for local dev.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "30s"

[realtime]
enabled = true
